<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinAgent - Trợ Lý Tín Dụng Zalo</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script src="[https://unpkg.com/react@18/umd/react.production.min.js](https://unpkg.com/react@18/umd/react.production.min.js)"></script>
  <script src="[https://unpkg.com/react-dom@18/umd/react-dom.production.min.js](https://unpkg.com/react-dom@18/umd/react-dom.production.min.js)"></script>
  <script src="[https://unpkg.com/@babel/standalone/babel.min.js](https://unpkg.com/@babel/standalone/babel.min.js)"></script>
  <script src="[https://unpkg.com/lucide-react/dist/umd/lucide-react.min.js](https://unpkg.com/lucide-react/dist/umd/lucide-react.min.js)"></script>
</head>
<body class="bg-[#eef0f3] text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [messages, setMessages] = useState([
        {
          id: '1',
          sender: 'agent',
          text: 'Dạ em chào anh/chị! Em là FinAgent - Chuyên viên hỗ trợ thẩm định tín dụng cho hộ kinh doanh nhỏ lẻ. Anh/chị cho em xin tên và mô hình kinh doanh buôn bán hiện tại của mình với ạ? (Hoặc có thể bấm biểu tượng đính kèm ảnh gửi sổ ghi chép/hóa đơn cho em nhé!)',
          timestamp: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
        }
      ]);
      const [extractedData, setExtractedData] = useState({
        merchant_name: null, business_type: null, revenue_monthly: null,
        expense_monthly: null, loan_amount: null, loan_term_months: 12, loan_purpose: null
      });
      const [isLoading, setIsLoading] = useState(false);
      const [selectedImage, setSelectedImage] = useState(null);
      const [inputText, setInputText] = useState("");
      const [reportData, setReportData] = useState(null);
      const [isReportOpen, setIsReportOpen] = useState(false);

      const messagesEndRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isLoading]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setSelectedImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleSendMessage = async () => {
        if (!inputText.trim() && !selectedImage) return;

        const userMsg = {
          id: Date.now().toString(),
          sender: 'user',
          text: inputText || 'Đã gửi ảnh chứng từ sổ sách',
          image: selectedImage,
          timestamp: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
        };

        setMessages(prev => [...prev, userMsg]);
        setIsLoading(true);
        const currentImg = selectedImage;
        const currentText = inputText;
        setInputText("");
        setSelectedImage(null);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: currentText,
              image: currentImg,
              current_data: extractedData
            })
          });
          const data = await res.json();

          if (data.extracted_data) setExtractedData(data.extracted_data);

          const agentMsg = {
            id: (Date.now() + 1).toString(),
            sender: 'agent',
            text: data.reply_to_user || 'Dạ em cảm ơn anh/chị!',
            timestamp: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
          };
          setMessages(prev => [...prev, agentMsg]);
        } catch (err) {
          setMessages(prev => [...prev, {
            id: Date.now().toString(),
            sender: 'system',
            text: 'Lỗi kết nối FinAgent AI. Xin thử lại!',
            timestamp: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
          }]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleExportReport = async () => {
        setIsReportOpen(true);
        try {
          const res = await fetch('/api/export-report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ extracted_data: extractedData })
          });
          const data = await res.json();
          setReportData(data);
        } catch (err) {
          console.error(err);
        }
      };

      const formatVND = (num) => num ? new Intl.NumberFormat('vi-VN').format(num) + ' đ' : 'Chưa có';

      return (
        <div className="flex flex-col h-screen bg-[#eef0f3]">
          {/* Header */}
          <div className="bg-[#0068ff] text-white p-4 flex justify-between items-center shadow-md">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold text-lg">FA</div>
              <div>
                <h1 className="font-bold text-base">FinAgent - Trợ Lý Tín Dụng Zalo</h1>
                <p className="text-xs text-blue-100">Thẩm định hồ sơ Hộ kinh doanh</p>
              </div>
            </div>
            <button onClick={handleExportReport} className="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-4 py-2 rounded-xl text-xs shadow-md transition">
              📑 Xuất Tờ Trình Thẩm Định
            </button>
          </div>

          {/* Main Content */}
          <div className="flex-1 flex overflow-hidden">
            {/* Chat Box */}
            <div className="flex-1 flex flex-col justify-between bg-[#eef0f3] p-4 relative">
              <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                {messages.map(msg => (
                  <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[80%] p-3.5 rounded-2xl text-sm shadow-xs ${msg.sender === 'user' ? 'bg-[#0068ff] text-white rounded-tr-xs' : 'bg-white text-slate-800 rounded-tl-xs border border-slate-200'}`}>
                      {msg.image && <img src={msg.image} className="max-w-full max-h-48 rounded-lg mb-2 object-cover" />}
                      <div>{msg.text}</div>
                      <div className={`text-[10px] mt-1 text-right ${msg.sender === 'user' ? 'text-blue-100' : 'text-slate-400'}`}>{msg.timestamp}</div>
                    </div>
                  </div>
                ))}
                {isLoading && (
                  <div className="text-xs text-slate-500 italic bg-white p-3 rounded-xl border w-fit">
                    🤖 FinAgent đang phân tích chứng từ & tính toán số liệu...
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>

              {/* Image Preview */}
              {selectedImage && (
                <div className="mb-2 p-2 bg-white rounded-xl flex items-center justify-between border">
                  <span className="text-xs text-slate-600 font-medium">📷 Đã chọn 1 ảnh chứng từ</span>
                  <button onClick={() => setSelectedImage(null)} className="text-red-500 font-bold text-xs px-2">Xóa</button>
                </div>
              )}

              {/* Input Dock */}
              <div className="bg-white p-2.5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-2">
                <label className="cursor-pointer p-2 hover:bg-slate-100 rounded-full text-slate-500" title="Đính kèm sổ sách/hóa đơn">
                  📷 <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                </label>
                <input 
                  type="text" 
                  value={inputText} 
                  onChange={e => setInputText(e.target.value)} 
                  onKeyDown={e => e.key === 'Enter' && handleSendMessage()}
                  placeholder="Nhập tin nhắn hoặc đính kèm ảnh sổ sách..." 
                  className="flex-1 bg-transparent text-sm outline-none px-2"
                />
                <button onClick={handleSendMessage} className="bg-[#0068ff] text-white px-4 py-2 rounded-xl font-bold text-xs hover:bg-blue-700 transition">
                  Gửi
                </button>
              </div>
            </div>

            {/* Right Sidebar: Real-time Data */}
            <div className="hidden lg:block w-80 bg-white border-l border-slate-200 p-4 overflow-y-auto">
              <h2 className="font-bold text-sm text-slate-700 mb-3 flex items-center gap-1.5">📊 Dữ Liệu Bóc Tách Realtime</h2>
              <div className="space-y-3 text-xs">
                <div className="p-3 bg-slate-50 rounded-xl border"><span className="text-slate-400 block">Tên Hộ KD:</span> <strong className="text-slate-800 text-sm">{extractedData.merchant_name || 'Chưa nhận diện'}</strong></div>
                <div className="p-3 bg-slate-50 rounded-xl border"><span className="text-slate-400 block">Mô Hình:</span> <strong className="text-slate-800 text-sm">{extractedData.business_type || 'Chưa nhận diện'}</strong></div>
                <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200"><span className="text-emerald-600 block">Doanh Thu Hàng Tháng:</span> <strong className="text-emerald-700 text-sm">{formatVND(extractedData.revenue_monthly)}</strong></div>
                <div className="p-3 bg-rose-50 rounded-xl border border-rose-200"><span className="text-rose-600 block">Chi Phí Hàng Tháng:</span> <strong className="text-rose-700 text-sm">{formatVND(extractedData.expense_monthly)}</strong></div>
                <div className="p-3 bg-blue-50 rounded-xl border border-blue-200"><span className="text-blue-600 block">Nhu Cầu Vay Đề Xuất:</span> <strong className="text-blue-700 text-sm">{formatVND(extractedData.loan_amount)}</strong></div>
              </div>
            </div>
          </div>

          {/* Report Modal */}
          {isReportOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative border">
                <button onClick={() => setIsReportOpen(false)} className="absolute top-4 right-4 font-bold text-slate-400 hover:text-slate-700">✕</button>
                <h3 className="font-bold text-lg text-blue-600 mb-4">📄 Tờ Trình Thẩm Định Tín Dụng</h3>
                {reportData ? (
                  <div className="space-y-3 text-xs text-slate-700">
                    <div className="p-3 bg-slate-100 rounded-lg"><strong>Khách hàng:</strong> {reportData.merchant_name} ({reportData.business_type})</div>
                    <div className="grid grid-cols-2 gap-2">
                      <div className="p-2.5 bg-slate-50 border rounded-lg"><strong>Thu nhập ròng:</strong> {formatVND(reportData.financial_summary?.net_profit)}</div>
                      <div className="p-2.5 bg-slate-50 border rounded-lg"><strong>Gốc lãi/tháng:</strong> {formatVND(reportData.financial_summary?.estimated_monthly_payment)}</div>
                    </div>
                    <div className="p-3 bg-amber-50 border border-amber-200 rounded-lg text-amber-800"><strong>Tỷ lệ trả nợ DSR:</strong> {reportData.financial_summary?.dsr_ratio}%</div>
                    <div className="p-3 bg-blue-50 border border-blue-200 rounded-lg text-blue-900"><strong>Trạng thái:</strong> {reportData.approval_status}</div>
                    <p className="text-slate-500 italic mt-2">{reportData.recommendation}</p>
                  </div>
                ) : <div className="py-8 text-center text-slate-400">Đang tổng hợp dữ liệu tờ trình...</div>}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
